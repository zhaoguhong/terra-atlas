<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">岩石循环是一组可能路径</title><desc id="desc">箭头说明部分转化方向，并非固定必经顺序。任何出露岩石都可能风化，更多转化需要相应地质条件。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">岩石循环是一组可能路径</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="60" y="175" width="260" height="102" rx="12" fill="#dbe7d4"/><text x="80" y="213" font-size="24" text-anchor="start" fill="#233c36">岩浆岩</text><text x="80" y="251" font-size="19" text-anchor="start" fill="#233c36">岩浆或熔岩冷却</text><rect x="680" y="175" width="260" height="102" rx="12" fill="#dbe7d4"/><text x="700" y="213" font-size="24" text-anchor="start" fill="#233c36">沉积岩</text><text x="700" y="251" font-size="19" text-anchor="start" fill="#233c36">沉积物成岩等过程</text><rect x="365" y="395" width="270" height="102" rx="12" fill="#dbe7d4"/><text x="385" y="433" font-size="24" text-anchor="start" fill="#233c36">变质岩</text><text x="385" y="471" font-size="19" text-anchor="start" fill="#233c36">温压与流体等改造</text><path d="M335 220 L660 220" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="193" font-size="19" text-anchor="middle" fill="#233c36">风化、沉积与成岩</text><path d="M790 290 L650 420" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M210 290 L350 420" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="150" y="365" font-size="20" text-anchor="start" fill="#233c36">变质</text><text x="775" y="365" font-size="20" text-anchor="start" fill="#233c36">变质</text><path d="M365 470 Q150 500 130 300" fill="none" stroke="#b7735c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="95" y="505" font-size="19" text-anchor="start" fill="#233c36">熔融、冷却</text></g></svg>