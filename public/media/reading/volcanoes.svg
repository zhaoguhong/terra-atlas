<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">火山形态与喷出物的堆积</title><desc id="desc">盾状火山与复合火山的理想剖面用于比较外形。喷发危险程度不能单凭坡度判断。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">火山形态与喷出物的堆积</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M55 425 Q180 405 260 335 Q340 405 465 425 L465 465 L55 465 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M555 425 L745 200 L775 200 L950 425 L950 465 L555 465 Z" fill="#b7735c" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M760 430 L760 250" fill="none" stroke="#e5ad69" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/><text x="260" y="190" font-size="27" text-anchor="middle" fill="#233c36">盾状火山</text><text x="260" y="235" font-size="21" text-anchor="middle" fill="#233c36">较缓的宽阔山体</text><text x="750" y="145" font-size="27" text-anchor="middle" fill="#233c36">复合火山</text><text x="500" y="520" font-size="22" text-anchor="middle" fill="#233c36">熔岩性质、碎屑与喷发方式影响堆积形态</text></g></svg>