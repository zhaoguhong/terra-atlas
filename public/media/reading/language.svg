<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">同一个人，可以在不同场景使用不同语言</title><desc id="desc">家庭、学校与工作中的语言使用可能不同。官方语言、母语和通用语应分别认识。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">同一个人，可以在不同场景使用不同语言</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><circle cx="500" cy="275" r="60" fill="#729875"/><text x="500" y="285" font-size="25" text-anchor="middle" fill="#fff">个人</text><rect x="65" y="170" width="265" height="102" rx="12" fill="#dbe7d4"/><text x="85" y="208" font-size="24" text-anchor="start" fill="#233c36">家庭</text><text x="85" y="246" font-size="19" text-anchor="start" fill="#233c36">成长与家庭交流</text><rect x="670" y="170" width="265" height="102" rx="12" fill="#dbe7d4"/><text x="690" y="208" font-size="24" text-anchor="start" fill="#233c36">学校</text><text x="690" y="246" font-size="19" text-anchor="start" fill="#233c36">教育与学习</text><rect x="365" y="410" width="270" height="102" rx="12" fill="#dbe7d4"/><text x="385" y="448" font-size="24" text-anchor="start" fill="#233c36">工作与社会</text><text x="385" y="486" font-size="19" text-anchor="start" fill="#233c36">跨群体交流</text><path d="M335 225 L425 265" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M660 225 L575 265" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path 