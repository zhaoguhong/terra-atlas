<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">资源、生产与用能之间的联系</title><desc id="desc">资源分布不等于消费分布。输送与调节把不同时间、不同地点的供给和需求接起来。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">资源、生产与用能之间的联系</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="55" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="75" y="248" font-size="24" text-anchor="start" fill="#233c36">资源条件</text><text x="75" y="286" font-size="19" text-anchor="start" fill="#233c36">地质、风、日照、来水</text><path d="M335 260 L350 260" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><rect x="360" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="380" y="248" font-size="24" text-anchor="start" fill="#233c36">生产与调节</text><text x="380" y="286" font-size="19" text-anchor="start" fill="#233c36">开采、发电、储存</text><path d="M640 260 L655 260" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><rect x="665" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="685" y="248" font-size="24" text-anchor="start" fill="#233c36">用能地区</text><text x="685" y="286" font-size="19" text-anchor="start" fill="#233c36">电网、运输与需求</text><text x="500" y="420" font-size="22" text-anchor="middle" fill="#233c36">比较时区分：资源量 · 产量 · 容量 · 实际使用</text></g></svg>