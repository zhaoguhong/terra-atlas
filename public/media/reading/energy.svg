<svg xmlns="http://www.w3.org/2000/svg" width="540" height="304" viewBox="0 0 540 304" role="img" aria-labelledby="title desc">
<title id="title">装机容量与实际发电量</title><desc id="desc">装机容量给出额定功率，发电量还取决于实际运行功率和持续时间。图中使用相同设备的两个假设时段，便于比较。</desc>
<defs><marker id="warm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aa583b"/></marker><marker id="cool" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#236b81"/></marker></defs>
<rect x="0" y="0" width="540" height="304" rx="10" fill="#f7f5ec"/><g font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><text x="20" y="39" font-size="29" fill="#233e39" text-anchor="start">装机容量与实际发电量</text><text x="25" y="88" font-size="24" fill="#233e39" text-anchor="start">同一台额定功率 1 千瓦的设备</text>
<rect x="20" y="109" width="504" height="56" rx="6" fill="#e2eadc"/>
<text x="35" y="146" font-size="23" fill="#233e39" text-anchor="start">满功率 1 小时</text>
<text x="324" y="146" font-size="25" fill="#233e39" text-anchor="start">1 千瓦时</text>
<rect x="20" y="178" width="504" height="56" rx="6" fill="#ede6d7"/>
<text x="35" y="215" font-size="23" fill="#233e39" text-anchor="start">满功率 3 小时</text>
<text x="324" y="215" font-size="25" fill="#233e39" text-anchor="start">3 千瓦时</text>
<text x="25" y="261" font-size="21" fill="#233e39" text-anchor="start">满功率运行时，发电量随时间增加。</text><text x="520" y="292" font-size="16" fill="#53675f" text-anchor="end">概念示意 · 非实测</text></g></svg>
