<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">冲积扇与三角洲：沉积发生在不同位置</title><desc id="desc">冲积扇常见于水流出山后的坡度变化处；三角洲与河口输沙和海洋作用有关。两图均为平面示意。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">冲积扇与三角洲：沉积发生在不同位置</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M80 195 L210 300 L80 430 L80 195 M410 195 L280 300 L410 430 Z" fill="#c5a471" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M245 275 L150 460 Q250 505 350 460 Z" fill="#dcc49b" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M245 170 L245 290 M245 290 L200 455 M245 290 L290 460" fill="none" stroke="#5c9fb1" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="245" y="130" font-size="25" text-anchor="middle" fill="#233c36">出山口冲积扇</text><rect x="550" y="315" width="400" height="160" rx="0" fill="#bddfe5"/><path d="M750 250 L610 425 L890 425 Z" fill="#dcc49b" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M750 170 L750 285 L665 410 M750 285 L830 410 M750 285 L745 420" fill="none" stroke="#5c9fb1" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="750" y="130" font-size="25" text-anchor="middle" fill="#233c36">河口三角洲</text><text x="575" y="495" font-size="