<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">黄土塬、梁、峁：堆积物被沟谷分割</title><desc id="desc">黄土提供物质，流水与坡面过程塑造沟壑及残留高地。此图比较典型形态，不表示固定的演化阶段。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">黄土塬、梁、峁：堆积物被沟谷分割</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M60 440 L95 250 L300 250 L350 440 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M390 440 L465 270 L520 255 L580 440 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M640 440 Q690 200 745 310 Q800 270 865 440 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="130" y="170" font-size="25" text-anchor="start" fill="#233c36">塬</text><text x="130" y="205" font-size="19" text-anchor="start" fill="#233c36">顶部较宽平</text><text x="420" y="170" font-size="25" text-anchor="start" fill="#233c36">梁</text><text x="420" y="205" font-size="19" text-anchor="start" fill="#233c36">长条状高地</text><text x="690" y="170" font-size="25" text-anchor="start" fill="#233c36">峁</text><text x="690" y="205" font-size="19" text-anchor="start" fill="#233c36">丘状高地</text><text x="500" y="510" font-size="23" text-anchor="middle" fill="#233c36">沟谷分割程度与地形、材料和过程有关</text></g></svg>