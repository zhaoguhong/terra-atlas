<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">岩层弯曲与断裂</title><desc id="desc">褶皱使岩层弯曲，断层使岩体沿破裂面发生相对位移。此图展示理想结构，地表形态还受后期侵蚀影响。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">岩层弯曲与断裂</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M55 330 Q140 240 240 330 T440 330" fill="none" stroke="#c5a471" stroke-width="23" stroke-linejoin="round" stroke-linecap="round"/><path d="M55 362 Q140 272 240 362 T440 362" fill="none" stroke="#b7735c" stroke-width="23" stroke-linejoin="round" stroke-linecap="round"/><path d="M55 394 Q140 304 240 394 T440 394" fill="none" stroke="#729875" stroke-width="23" stroke-linejoin="round" stroke-linecap="round"/><text x="80" y="165" font-size="25" text-anchor="start" fill="#233c36">褶皱</text><text x="80" y="200" font-size="19" text-anchor="start" fill="#233c36">岩层发生弯曲</text><rect x="550" y="295" width="155" height="29" rx="0" fill="#dbe7d4"/><rect x="550" y="328" width="155" height="29" rx="0" fill="#c5a471"/><rect x="550" y="361" width="155" height="29" rx="0" fill="#b7735c"/><rect x="720" y="355" width="210" height="29" rx="0" fill="#dbe7d4"/><rect x="720" y="388" width="210" height="29" rx="0" fill="#c5a471"/><rect x="720" y="421" width="210" height="29" rx="0" fill="#b7735c"/><path d="M715 255 L715 465" fill="none" stroke="#233c36" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M690 370 L690 280" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M745 315 L745 405" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="565" y="165" font-size="25" text-anchor="start" fill="#233c36">断层</text><text x="565" y="200" font-size="19" text-anchor="start" fill="#233c36">破裂两侧发生位移</text></g></svg>