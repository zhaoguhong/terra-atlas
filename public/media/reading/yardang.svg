<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">雅丹：风蚀塑造沟槽与垄脊</title><desc id="desc">坚实或半固结沉积物受风蚀和其他过程改造。图示表示形态与主导风向关系，不把所有长条地貌都认作雅丹。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">雅丹：风蚀塑造沟槽与垄脊</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M155 430 Q180 260 240 205 Q275 220 265 335 L210 455 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M325 430 Q350 260 410 205 Q445 220 435 335 L380 455 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M495 430 Q520 260 580 205 Q615 220 605 335 L550 455 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M665 430 Q690 260 750 205 Q785 220 775 335 L720 455 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M65 350 L140 220" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M830 420 L915 265" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="65" y="170" font-size="27" text-anchor="start" fill="#233c36">风蚀沟槽与残留垄脊</text><text x="655" y="500" font-size="23" text-anchor="start" fill="#233c36">侵蚀移走物质</text></g></svg>