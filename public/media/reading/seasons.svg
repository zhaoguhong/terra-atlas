<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">地轴倾斜使两半球季节相反</title><desc id="desc">两幅地球示意保持地轴方向一致。左侧北半球朝向太阳，右侧北半球背离太阳；距离与尺寸不按比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">地轴倾斜使两半球季节相反</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><circle cx="500" cy="295" r="58" fill="#dbb264"/><text x="500" y="400" font-size="24" text-anchor="middle" fill="#233c36">太阳</text><circle cx="230" cy="295" r="94" fill="#bddde1"/><path d="M188 420 L272 170" fill="none" stroke="#233c36" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="280" y="165" font-size="20" text-anchor="start" fill="#233c36">北</text><path d="M144 267 L316 324" fill="none" stroke="#729875" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="770" cy="295" r="94" fill="#bddde1"/><path d="M728 420 L812 170" fill="none" stroke="#233c36" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="820" y="165" font-size="20" text-anchor="start" fill="#233c36">北</text><path d="M684 267 L856 324" fill="none" stroke="#729875" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M430 290 L340 290" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M570 290 L660 290" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="230" y="480" font-size="23" text-anchor="middle" fill="#233c36">北半球夏季示意</text><text x="770" y="480" font-size="23" text-anchor="middle" fill="#233c36">北半球冬季示意</text></g></svg>