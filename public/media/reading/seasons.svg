<g transform="translate(437 151)"><circle cx="0" cy="0" r="54" fill="#b9dbe2"/><path d="M0 -54A54 54 0 0 1 0 54Z" fill="#829da5" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-27 72L28 -73" fill="none" stroke="#233e39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-49 -18L49 18" fill="none" stroke="#68845c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="-63" font-size="19" fill="#233e39" text-anchor="start">北</text></g>
