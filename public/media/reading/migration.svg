<svg xmlns="http://www.w3.org/2000/svg" width="540" height="281" viewBox="0 0 540 281" role="img" aria-labelledby="title desc">
<title id="title">迁入与迁出要分开数</title><desc id="desc">从乙地看，甲到乙是迁入，乙到甲是迁出。同期迁入人数减去迁出人数，得到乙地的净迁移人数。两个方向都很活跃时，净值仍可能接近零。</desc>
<defs><marker id="warm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aa583b"/></marker><marker id="cool" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#236b81"/></marker></defs>
<rect x="0" y="0" width="540" height="281" rx="10" fill="#f7f5ec"/><g font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><text x="20" y="39" font-size="29" fill="#233e39" text-anchor="start">迁入与迁出要分开数</text><rect x="25" y="109" width="95" height="80" rx="9" fill="#d7e4d0"/>
<rect x="420" y="109" width="95" height="80" rx="9" fill="#e7d4b6"/>
<text x="72" y="158" font-size="25" fill="#233e39" text-anchor="middle">甲地</text>
<text x="467" y="158" font-size="25" fill="#233e39" text-anchor="middle">乙地</text>
<path d="M140 125H397" fill="none" stroke="#236b81" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cool)"/>
<text x="268" y="105" font-size="23" fill="#233e39" text-anchor="middle">乙地的迁入</text>
<path d="M397 174H140" fill="none" stroke="#aa583b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#warm)"/>
<text x="268" y="210" font-size="23" fill="#233e39" text-anchor="middle">乙地的迁出</text>
<text x="270" y="248" font-size="21" fill="#233e39" text-anchor="middle">净迁移人数 ＝ 迁入人数 − 迁出人数</text><text x="520" y="269" font-size="16" fill="#53675f" text-anchor="end">概念示意 · 非实测</text></g></svg>
