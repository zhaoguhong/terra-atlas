<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">迁入、迁出与净迁移</title><desc id="desc">双向人口流动可以同时发生。净迁移是迁入减迁出，净值小不代表总流动小；本图没有实际流量。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">迁入、迁出与净迁移</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="70" y="220" width="280" height="102" rx="12" fill="#dbe7d4"/><text x="90" y="258" font-size="24" text-anchor="start" fill="#233c36">原居地</text><text x="90" y="296" font-size="19" text-anchor="start" fill="#233c36">家庭、工作与环境</text><rect x="650" y="220" width="280" height="102" rx="12" fill="#dbe7d4"/><text x="670" y="258" font-size="24" text-anchor="start" fill="#233c36">另一地区</text><text x="670" y="296" font-size="19" text-anchor="start" fill="#233c36">机会、联系与条件</text><path d="M365 240 L635 240" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M635 310 L365 310" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="200" font-size="22" text-anchor="middle" fill="#233c36">迁入方向</text><text x="500" y="365" font-size="22" text-anchor="middle" fill="#233c36">迁出方向</text><text x="500" y="465" font-size="24" text-anchor="middle" fill="#233c36">同时查看双向规模与统计时期</text></g></svg>