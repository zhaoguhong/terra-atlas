<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">海岸侵蚀与沿岸输沙</title><desc id="desc">岩岸突出崖壁和海蚀柱，沙岸则可发生沿岸搬运与堆积。示意比较不同过程，不是同一海岸的固定演化序列。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">海岸侵蚀与沿岸输沙</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="55" y="360" width="400" height="90" rx="0" fill="#bddfe5"/><path d="M55 200 L235 215 L235 350 L200 350 L200 450 L55 450 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M330 450 L325 295 L360 270 L380 450 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="115" y="150" font-size="25" text-anchor="start" fill="#233c36">侵蚀岩岸</text><rect x="550" y="210" width="400" height="240" rx="0" fill="#bddfe5"/><path d="M550 210 L950 210 L950 285 L760 285 L700 360 L650 345 L700 285 L550 285 Z" fill="#dac18d" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M590 390 L880 390" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="605" y="150" font-size="25" text-anchor="start" fill="#233c36">沙岸与沙嘴</text><text x="700" y="495" font-size="22" text-anchor="start" fill="#233c36">沿岸输沙</text></g></svg>