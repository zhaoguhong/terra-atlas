<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">河流侵蚀：向下切，也向两侧切</title><desc id="desc">左图是谷地横剖面，右图是曲流平面示意。凹岸与凸岸的侵蚀、堆积关系应结合流向观察。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">河流侵蚀：向下切，也向两侧切</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M55 220 L140 250 L260 410 L380 250 L460 220 L460 465 L55 465 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M245 395 Q260 410 275 395" fill="none" stroke="#5c9fb1" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><text x="260" y="155" font-size="25" text-anchor="middle" fill="#233c36">谷地横剖面</text><path d="M600 200 C900 125 900 335 700 300 C520 270 580 470 900 430" fill="none" stroke="#5c9fb1" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/><text x="705" y="155" font-size="25" text-anchor="middle" fill="#233c36">曲流平面</text><text x="800" y="270" font-size="20" text-anchor="start" fill="#233c36">凹岸侵蚀</text><text x="605" y="355" font-size="20" text-anchor="start" fill="#233c36">凸岸堆积</text><path d="M805 435 L900 430" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/></g></svg>