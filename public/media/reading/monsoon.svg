<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">季节变化会改变海陆间的气流</title><desc id="desc">图示只说明季节性热力与气流的关系，实际季风还受大尺度环流、地形和水汽条件影响。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">季节变化会改变海陆间的气流</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="55" y="330" width="415" height="100" rx="12" fill="#b8dce3"/><rect x="530" y="330" width="415" height="100" rx="12" fill="#c5a471"/><circle cx="770" cy="195" r="43" fill="#dcb475"/><g fill="#dce9e9"><circle cx="690" cy="245" r="20" fill="#dce9e9"/><circle cx="717" cy="237" r="29" fill="#dce9e9"/><circle cx="744" cy="245" r="22" fill="#dce9e9"/><rect x="674" y="245" width="87" height="21" rx="8" fill="#dce9e9"/></g><path d="M695 275 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M720 275 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M745 275 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M140 300 L850 300" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M830 175 Q500 95 165 175" fill="none" stroke="#5c9fb1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="250" y="470" font-size="26