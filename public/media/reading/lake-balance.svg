<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">湖泊的来水、耗水与储量</title><desc id="desc">湖面降水、河流和地下水可带来水；蒸发、出流等过程可带走水。各项收支决定储水变化。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">湖泊的来水、耗水与储量</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="320" y="260" width="360" height="170" rx="70" fill="#d5e8ec"/><text x="500" y="350" font-size="31" text-anchor="middle" fill="#233c36">湖泊储水</text><g fill="#dce9e9"><circle cx="455" cy="150" r="20" fill="#dce9e9"/><circle cx="482" cy="142" r="29" fill="#dce9e9"/><circle cx="509" cy="150" r="22" fill="#dce9e9"/><rect x="439" y="150" width="87" height="21" rx="8" fill="#dce9e9"/></g><path d="M500 185 L500 245" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="550" y="210" font-size="21" text-anchor="start" fill="#233c36">降水</text><path d="M105 310 L305 310" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="80" y="285" font-size="21" text-anchor="start" fill="#233c36">入湖河流</text><path d="M690 310 L885 310" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="750" y="285" font-size="21" text-anchor="start" fill="#233c36">出湖河流</text><path d="M635 270 L735 160" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="760" y="160" font-size="21" text-anchor="start" fill="#233c36">蒸发</text><path d="M365 465 L405 425" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M590 430 L635 480" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="360" y="520" font-size="20" text-anchor="start" fill="#233c36">地下水交换可能有不同方向</text></g></svg>