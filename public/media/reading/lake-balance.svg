<svg xmlns="http://www.w3.org/2000/svg" width="540" height="308" viewBox="0 0 540 308" role="img" aria-labelledby="title desc">
<title id="title">湖水从哪里来，又怎样离开</title><desc id="desc">两类湖泊都能接收河水和降水，也会蒸发。外流湖还可经出湖河排水，封闭湖盆缺少这一河流出口。地下水也可能与湖泊交换。</desc>
<defs><marker id="warm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aa583b"/></marker><marker id="cool" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#236b81"/></marker></defs>
<rect x="0" y="0" width="540" height="308" rx="10" fill="#f7f5ec"/><g font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><text x="20" y="39" font-size="29" fill="#233e39" text-anchor="start">湖水从哪里来，又怎样离开</text><g transform="translate(7 0)"><text x="125" y="93" font-size="23" fill="#233e39" text-anchor="middle">有出湖河的湖</text>
    <path d="M12 204L53 140 82 195Q122 229 164 193L172 187 234 194V241H12Z" fill="#dbc398" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M72 187Q120 246 171 187Z" fill="#b9dbe2" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31 158l50 39" fill="none" stroke="#236b81" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cool)"/><path d="M128 182v-60" fill="none" stroke="#236b81" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cool)"/><path d="M149 185q29-1 71 5" fill="none" stroke="#236b81" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cool)"/>
    <text x="125" y="268" font-size="20" fill="#233e39" text-anchor="middle">水可经河流流出</text></g>
<g transform="translate(272 0)"><text x="125" y="93" font-size="23" fill="#233e39" text-anchor="middle">封闭湖盆</text>
    <path d="M12 204L53 140 82 195Q122 229 164 193L194 144 234 204V241H12Z" fill="#dbc398" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M72 187Q120 246 171 187Z" fill="#b9dbe2" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31 158l50 39" fill="none" stroke="#236b81" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cool)"/><path d="M128 182v-60" fill="none" stroke="#236b81" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cool)"/>
    <text x="125" y="268" font-size="20" fill="#233e39" text-anchor="middle">水可经蒸发离开</text></g><text x="520" y="296" font-size="16" fill="#53675f" text-anchor="end">概念示意 · 非实测</text></g></svg>
