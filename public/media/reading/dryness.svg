<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">少雨可以有不同背景</title><desc id="desc">大陆内部、山地雨影与沿岸海气条件，都可能参与形成干旱。三种机制可同时作用，不是互斥的分类。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">少雨可以有不同背景</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="55" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="75" y="248" font-size="24" text-anchor="start" fill="#233c36">大陆内部</text><text x="75" y="286" font-size="19" text-anchor="start" fill="#233c36">远离主要水汽来源</text><rect x="360" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="380" y="248" font-size="24" text-anchor="start" fill="#233c36">山地雨影</text><text x="380" y="286" font-size="19" text-anchor="start" fill="#233c36">气流越山后条件改变</text><rect x="665" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="685" y="248" font-size="24" text-anchor="start" fill="#233c36">沿海环境</text><text x="685" y="286" font-size="19" text-anchor="start" fill="#233c36">冷水、下沉与稳定空气</text><text x="500" y="400" font-size="24" text-anchor="middle" fill="#233c36">判断干旱，还要比较降水与水分消耗</text><path d="M150 430 L850 430" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/></g></svg>