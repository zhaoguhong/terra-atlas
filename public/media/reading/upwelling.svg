<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">沿岸上升流：表层离岸，深水补充</title><desc id="desc">理想海岸横剖面。沿岸风与地球自转共同作用，可使表层海水离岸，较深的冷水上升补充并带来营养物质。箭头不表示实际速度或地理范围。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">沿岸上升流：表层离岸，深水补充</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="55" y="235" width="890" height="235" rx="0" fill="#bddfe5"/><path d="M55 200 L190 200 L225 260 L285 470 L55 470 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M300 465 Q380 430 390 330 Q400 260 510 260" fill="none" stroke="#5c9fb1" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M420 260 L620 260" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M650 260 L865 260" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M390 415 L390 320" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="85" y="160" font-size="25" text-anchor="start" fill="#233c36">陆地</text><text x="520" y="165" font-size="25" text-anchor="start" fill="#233c36">海洋</text><text x="620" y="220" font-size="23" text-anchor="start" fill="#233c36">表层海水离岸</text><text x="485" y="370" font-size="25" text-anchor="start" fill="#233c36">较深冷水上升补充</text><text x="485" y="412" font-size="21" text-anchor="start" fill="#233c36">营养物质进入有光照的表层</text><text x="500" y="520" font-size="22" text-anchor="middle" fill="#233c36">横剖面示意；沿岸风方向不在此剖面内</text></g></svg>