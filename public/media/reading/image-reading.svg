<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">读照片与影像，先核对这些条件</title><desc id="desc">颜色、形状和纹理是观察线索，位置、时间、尺度和处理方式决定能作出什么解释。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">读照片与影像，先核对这些条件</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="70" y="170" width="410" height="280" rx="12" fill="#dce8d4"/><path d="M70 380 L220 240 L350 390 L480 250 L480 450 L70 450 Z" fill="#729875" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M290 450 Q240 360 355 320 Q410 300 380 240" fill="none" stroke="#5c9fb1" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/><text x="550" y="205" font-size="24" text-anchor="start" fill="#233c36">位置：拍的是哪里</text><text x="550" y="270" font-size="24" text-anchor="start" fill="#233c36">时间：季节与拍摄日期</text><text x="550" y="335" font-size="24" text-anchor="start" fill="#233c36">尺度：能分辨多大地物</text><text x="550" y="400" font-size="24" text-anchor="start" fill="#233c36">颜色：自然色还是波段映射</text><text x="500" y="515" font-size="23" text-anchor="middle" fill="#233c36">先描述可见特征，再用其他资料验证解释</text></g></svg>