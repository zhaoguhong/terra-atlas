<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">地貌形成：建立高差，也不断搬运物质</title><desc id="desc">构造、火山和地表营力可同时作用。风化在原地改变岩石，侵蚀、搬运和沉积则让物质重新分配。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">地貌形成：建立高差，也不断搬运物质</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M40 410 L180 290 L280 155 L400 290 L510 410 Z" fill="#c5a471" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M420 350 Q620 455 900 430" fill="none" stroke="#5c9fb1" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M140 390 L140 280" fill="none" stroke="#b7735c" stroke-width="4" marker-end="url(#warm)"/><path d="M350 245 L450 355" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M570 420 L745 430" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="590" y="170" font-size="25" text-anchor="start" fill="#233c36">地表物质的去向</text><text x="590" y="205" font-size="19" text-anchor="start" fill="#233c36">风化 → 侵蚀 → 搬运 → 堆积</text><text x="95" y="485" font-size="21" text-anchor="start" fill="#233c36">隆升与构造建立高差</text><text x="650" y="485" font-size="21" text-anchor="start" fill="#233c36">低地接受部分沉积物</text></g></svg>