<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">同一等高距下，疏密反映坡度</title><desc id="desc">闭合等高线需结合数值判断高低。此图为理想山丘平面示意，不能用作实际地形测量。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">同一等高距下，疏密反映坡度</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><ellipse cx="490" cy="310" rx="365" ry="160" fill="none" stroke="#729875" stroke-width="3"/><text x="130" y="315" font-size="19" text-anchor="start" fill="#233c36">100</text><ellipse cx="515" cy="310" rx="285" ry="125" fill="none" stroke="#729875" stroke-width="3"/><text x="240" y="315" font-size="19" text-anchor="start" fill="#233c36">200</text><ellipse cx="540" cy="310" rx="205" ry="90" fill="none" stroke="#729875" stroke-width="3"/><text x="350" y="315" font-size="19" text-anchor="start" fill="#233c36">300</text><ellipse cx="565" cy="310" rx="125" ry="55" fill="none" stroke="#729875" stroke-width="3"/><text x="460" y="315" font-size="19" text-anchor="start" fill="#233c36">400</text><text x="190" y="125" font-size="23" text-anchor="start" fill="#233c36">线较疏：坡较缓</text><text x="625" y="125" font-size="23" text-anchor="start" fill="#233c36">线较密：坡较陡</text><text x="500" y="515" font-size="21" text-anchor="middle" fill="#233c36">单位：示例高程（米）；等高距 100 米</text></g></svg>