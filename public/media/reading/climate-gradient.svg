<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">自然分界常常是一段过渡</title><desc id="desc">纬度变化、海拔差异和海陆条件共同影响环境。分区线便于概括，真实温度与降水通常连续变化。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">自然分界常常是一段过渡</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><defs><linearGradient id="gradient"><stop stop-color="#b8d9df"/><stop offset="1" stop-color="#83a076"/></linearGradient></defs><rect x="80" y="260" width="840" height="110" rx="8" fill="url(#gradient)"/><path d="M480 215 L480 420" fill="none" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="220" font-size="25" text-anchor="start" fill="#233c36">一侧环境</text><text x="680" y="220" font-size="25" text-anchor="start" fill="#233c36">另一侧环境</text><text x="500" y="460" font-size="23" text-anchor="middle" fill="#233c36">概括分界 ≠ 所有现象同时突变</text><text x="500" y="160" font-size="24" text-anchor="middle" fill="#233c36">沿相同指标连续观察</text></g></svg>