<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">沙丘：搬运与堆积形成不对称坡面</title><desc id="desc">以单向主导风条件下的理想沙丘横剖面为例，迎风坡较缓，背风滑落面较陡。真实沙丘随风况和供沙变化。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">沙丘：搬运与堆积形成不对称坡面</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M70 425 Q230 400 430 340 L620 235 L750 425 L940 425 L940 465 L70 465 Z" fill="#d5b376" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M100 220 L420 220" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="140" y="180" font-size="24" text-anchor="start" fill="#233c36">主导风向</text><text x="190" y="300" font-size="25" text-anchor="start" fill="#233c36">迎风坡</text><text x="190" y="335" font-size="19" text-anchor="start" fill="#233c36">沙粒沿坡搬运</text><text x="720" y="270" font-size="25" text-anchor="start" fill="#233c36">背风坡</text><text x="720" y="305" font-size="19" text-anchor="start" fill="#233c36">沙粒滑落、堆积</text><path d="M640 265 L715 385" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="450" y="510" font-size="22" text-anchor="start" fill="#233c36">风积地貌</text></g></svg>