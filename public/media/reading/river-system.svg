<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">从支流到干流，再到出口</title><desc id="desc">河网连接集水区。蓝线表示示意河道，虚线表示示意流域范围，不对应任何真实河流的边界。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">从支流到干流，再到出口</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M210 160 Q475 95 700 170 L850 360 L690 470 L300 470 L125 330 Z" fill="#dbe7d4" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M210 160 Q475 95 700 170 L850 360 L690 470 L300 470 L125 330 Z" fill="none" stroke="#729875" stroke-width="3" stroke-dasharray="10 9"/><path d="M350 170 Q420 230 480 270 Q460 350 580 405 L790 470" fill="none" stroke="#5c9fb1" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 280 L480 270 M620 190 L480 270 M735 335 L580 405" fill="none" stroke="#5c9fb1" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="190" y="230" font-size="22" text-anchor="start" fill="#233c36">支流</text><text x="530" y="330" font-size="24" text-anchor="start" fill="#233c36">干流</text><text x="730" y="505" font-size="22" text-anchor="start" fill="#233c36">出口</text><text x="55" y="130" font-size="22" text-anchor="start" fill="#233c36">分水岭围成流域</text><path d="M600 410 L700 445" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/></g></svg>