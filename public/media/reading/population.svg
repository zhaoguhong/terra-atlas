<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">总量、密度与空间分布</title><desc id="desc">左侧与右侧各放置十二个示意人口点，面积不同，密度便不同。示例不对应任何真实地区。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">总量、密度与空间分布</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="75" y="210" width="280" height="210" rx="12" fill="#dbe7d4"/><rect x="510" y="185" width="390" height="260" rx="12" fill="#dbe7d4"/><circle cx="130" cy="260" r="9" fill="#233c36"/><circle cx="570" cy="240" r="9" fill="#233c36"/><circle cx="185" cy="260" r="9" fill="#233c36"/><circle cx="660" cy="240" r="9" fill="#233c36"/><circle cx="240" cy="260" r="9" fill="#233c36"/><circle cx="750" cy="240" r="9" fill="#233c36"/><circle cx="295" cy="260" r="9" fill="#233c36"/><circle cx="840" cy="240" r="9" fill="#233c36"/><circle cx="130" cy="315" r="9" fill="#233c36"/><circle cx="570" cy="315" r="9" fill="#233c36"/><circle cx="185" cy="315" r="9" fill="#233c36"/><circle cx="660" cy="315" r="9" fill="#233c36"/><circle cx="240" cy="315" r="9" fill="#233c36"/><circle cx="750" cy="315" r="9" fill="#233c36"/><circle cx="295" cy="315" r="9" fill="#233c36"/><circle cx="840" cy="315" r="9" fill="#233c36"/><circle cx="130" cy="370" r="9" fill="#233c36"/><circle cx="570" cy="390" r="9" fill="#233c36"/><circle cx="185" cy="370" r="9" fill="#233c36"/><ci