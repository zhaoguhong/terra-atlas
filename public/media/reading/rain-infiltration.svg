  <title id="title">同一场雨，两种地面</title>
  <desc id="desc">相同的雨落在左右两块缓坡上。左边的地面有连续的柏油层，箭头沿路面向低处走。右边长着草，箭头穿过地表，进入有孔隙的土层。</desc>
