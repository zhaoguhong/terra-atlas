<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">冷锋：冷空气推进，暖空气被抬升</title><desc id="desc">理想横剖面，展示相对冷暖与抬升。降雨还需要水汽等条件；不是某次天气系统的实测图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">冷锋：冷空气推进，暖空气被抬升</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="55" y="435" width="890" height="35" rx="0" fill="#729875"/><path d="M55 435 L55 265 Q260 285 540 435 Z" fill="#bddfe5" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M120 390 L390 390" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M470 400 L365 250" fill="none" stroke="#b7735c" stroke-width="4" marker-end="url(#warm)"/><g fill="#dce9e9"><circle cx="385" cy="190" r="20" fill="#dce9e9"/><circle cx="412" cy="182" r="29" fill="#dce9e9"/><circle cx="439" cy="190" r="22" fill="#dce9e9"/><rect x="369" y="190" width="87" height="21" rx="8" fill="#dce9e9"/></g><path d="M400 230 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M425 230 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M450 230 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="320" font-size="24" text-anchor="start" fill="#233c36">相对较冷的空气</text><text x="600" y="285" font-size="24" text-anchor="start" fill="#233c36">相对较暖的空气</text><text x="575" y="350" font-size="22" text-anchor="start" fill="#233c36">被抬升后冷却</text><text x="500" y="510" font-size="23" text-anchor="middle" fill="#233c36">风向、气温、云雨随系统移动而变化</text></g></svg>