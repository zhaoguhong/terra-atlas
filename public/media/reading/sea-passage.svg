<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">天然海峡与人工运河</title><desc id="desc">两侧陆地之间的天然水道与人工贯通的航道，连接方式不同。平面图为概念示意，不是实际航线。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">天然海峡与人工运河</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="60" y="205" width="390" height="250" rx="12" fill="#d5e8ec"/><path d="M60 205 L210 205 L235 260 L195 320 L220 455 L60 455 Z" fill="#dbe7d4" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M310 205 L450 205 L450 455 L290 455 L315 330 L280 270 Z" fill="#dbe7d4" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M260 430 L260 220" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="255" y="160" font-size="26" text-anchor="middle" fill="#233c36">海峡</text><rect x="550" y="205" width="390" height="250" rx="12" fill="#d5e8ec"/><rect x="550" y="285" width="390" height="95" rx="0" fill="#c5a471"/><rect x="725" y="285" width="40" height="95" rx="0" fill="#d5e8ec"/><path d="M745 430 L745 220" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="745" y="160" font-size="26" text-anchor="middle" fill="#233c36">运河</text></g></svg>