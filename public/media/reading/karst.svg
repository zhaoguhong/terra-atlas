<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">喀斯特：地上与地下通过水相连</title><desc id="desc">剖面连接峰丛、裂隙、洞穴与泉。白色洞穴是概念示意；真实地下通道必须通过地质和水文调查确定。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">喀斯特：地上与地下通过水相连</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M55 300 L120 290 L150 185 L180 290 L220 290 L250 140 L285 285 L330 285 L360 175 L400 295 L560 305 L650 285 L700 305 L945 305 L945 475 L55 475 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M315 410 Q400 350 485 410 Q550 455 620 400 L760 405 L760 445 L610 445 Q550 485 480 445 Q400 400 315 450 Z" fill="#f8f5ec" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M540 305 L560 365 L610 400" fill="none" stroke="#5c9fb1" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M365 437 Q470 419 530 447 Q610 421 755 430 L800 310 L920 310" fill="none" stroke="#5c9fb1" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M548 330 L570 372" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><g fill="#dce9e9"><circle cx="460" cy="150" r="20" fill="#dce9e9"/><circle cx="487" cy="142" r="29" fill="#dce9e9"/><circle cx="514" cy="150" r="22" fill="#dce9e9"/><rect x="444" y="150" width="87" height="21" rx="8" fill="#dce9e9"/></g><path d="M465 185 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M490 185 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M515 185 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="100" y="120" font-size="23" text-anchor="start" fill="#233c36">峰丛与洼地</text><text x="565" y="275" font-size="21" text-anchor="start" fill="#233c36">下渗</text><text x="400" y="505" font-size="22" text-anchor="start" fill="#233c36">洞穴与地下水通道</text><text x="800" y="280" font-size="23" text-anchor="start" fill="#233c36">泉</text></g></svg>