<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">气流越过山地时会发生什么</title><desc id="desc">湿空气抬升冷却，有利于迎风侧降水；另一侧可能较干。实际差异还取决于气流方向、季节和区域环流。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">气流越过山地时会发生什么</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M50 415 L280 415 L500 190 L720 415 L950 415 L950 465 L50 465 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><g fill="#dce9e9"><circle cx="280" cy="220" r="20" fill="#dce9e9"/><circle cx="307" cy="212" r="29" fill="#dce9e9"/><circle cx="334" cy="220" r="22" fill="#dce9e9"/><rect x="264" y="220" width="87" height="21" rx="8" fill="#dce9e9"/></g><path d="M280 250 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M305 250 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M330 250 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M85 340 Q225 345 345 215 Q495 60 655 215 Q775 350 920 350" fill="none" stroke="#5c9fb1" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M145 338 L225 325" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M775 325 L860 347" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="85" y="145" font-size="25" text-anchor="start" fill="#233c36">迎风侧</text><text x="85" y="180" font-size="19" text-anchor="start" fill="#233c36">气流抬升、冷却</text><text x="690" y="145" font-size="25" text-anchor="start" fill="#233c36">背风侧</text><text x="690" y="180" font-size="19" text-anchor="start" fill="#233c36">气流可能下沉、变干</text><text x="425" y="500" font-size="19" text-anchor="start" fill="#233c36">风向与季节需结合具体地区判断</text></g></svg>