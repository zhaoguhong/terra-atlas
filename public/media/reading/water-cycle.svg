<text x="183" y="130" text-anchor="start" font-size="22" fill="#233e39">水汽随风移动</text>
<text x="419" y="124" text-anchor="start" font-size="24" fill="#233e39">降雨</text>
<path d="M320 177Q269 213 222 227T146 250" fill="none" stroke="#196581" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/>
<text x="193" y="280" text-anchor="start" font-size="24" fill="#233e39">地表径流</text>
<path d="M368 158Q371 203 380 232" fill="none" stroke="#196581" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/>
<text x="398" y="211" text-anchor="start" font-size="24" fill="#233e39">下渗</text>
<text x="26" y="274" text-anchor="start" font-size="24" fill="#233e39">海洋</text>
