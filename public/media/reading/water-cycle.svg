<path d="M339 102Q330 92 342 85Q345 70 360 74Q373 59 386 74Q404 71 407 86Q424 93 412 102Z" fill="#c8dce0" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(357 110)" fill="none" stroke="#5892a4" stroke-width="3" stroke-linecap="round">
    <path d="M0 0l-4 9m24-9l-4 9m24-9l-4 9"/>
  </g>
<path d="M75 222V126" fill="none" stroke="#196581" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/>
<text x="25" y="178" text-anchor="start" font-size="24" fill="#233e39">蒸发</text>
