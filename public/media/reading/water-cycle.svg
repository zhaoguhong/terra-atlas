<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 335" width="540" height="335" role="img" aria-labelledby="title desc">
  <title id="title">从海面到陆地</title>
  <desc id="desc">海面上方的箭头向上，再随风指向山地上空的云。雨从云中落下，山坡上的两支箭头分别顺坡流向海面和向下进入土层。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#196581"/></marker>
    <pattern id="grains" patternUnits="userSpaceOnUse" width="22" height="16"><ellipse cx="5" cy="5" rx="2.5" ry="1.6" fill="#8e7958" opacity=".38"/><circle cx="16" cy="12" r="1.5" fill="#8e7958" opacity=".38"/></pattern>
  </defs>
  <rect width="100%" height="100%" rx="10" fill="#f7f5ec"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <text x="22" y="42" text-anchor="start" font-size="28" fill="#233e39">从海面到陆地</text>
    <rect x="16" y="60" width="508" height="232" rx="7" fill="#f0f5ef"/>
<path d="M16 231H180L202 292H16Z" fill="#afd5da" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
