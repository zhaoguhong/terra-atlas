<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">自然过程与暴露，共同影响风险</title><desc id="desc">山坡上的物质运动与河流洪水具有不同机制。是否形成严重损失，还取决于人、设施和应对条件。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">自然过程与暴露，共同影响风险</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M55 435 L230 190 L440 420 L945 420 L945 465 L55 465 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="300" cy="285" r="13" fill="#b7735c"/><circle cx="330" cy="325" r="13" fill="#b7735c"/><circle cx="360" cy="365" r="13" fill="#b7735c"/><path d="M330 300 L425 400" fill="none" stroke="#b7735c" stroke-width="4" marker-end="url(#warm)"/><path d="M445 430 Q600 395 920 440" fill="none" stroke="#5c9fb1" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/><rect x="610" y="350" width="45" height="65" rx="0" fill="#729875"/><rect x="700" y="350" width="45" height="65" rx="0" fill="#729875"/><rect x="800" y="350" width="45" height="65" rx="0" fill="#729875"/><text x="65" y="140" font-size="25" text-anchor="start" fill="#233c36">坡面运动</text><text x="640" y="300" font-size="25" text-anchor="start" fill="#233c36">河谷与聚落</text><text x="500" y="515" font-size="24" text-anchor="middle" fill="#233c36">过程强度 · 人口与设施暴露 · 脆弱性</text></g></svg>