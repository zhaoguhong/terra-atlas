<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">认识一个地区，可以顺着这条线</title><desc id="desc">位置、自然条件与人类活动相互联系。区域比较使用相同问题，再回到具体地点检查内部差异。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">认识一个地区，可以顺着这条线</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="55" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="75" y="248" font-size="24" text-anchor="start" fill="#233c36">位置与范围</text><text x="75" y="286" font-size="19" text-anchor="start" fill="#233c36">纬度、海陆、相邻地区</text><path d="M335 260 L350 260" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><rect x="360" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="380" y="248" font-size="24" text-anchor="start" fill="#233c36">自然条件</text><text x="380" y="286" font-size="19" text-anchor="start" fill="#233c36">地形、水系、气候</text><path d="M640 260 L655 260" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><rect x="665" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="685" y="248" font-size="24" text-anchor="start" fill="#233c36">活动与联系</text><text x="685" y="286" font-size="19" text-anchor="start" fill="#233c36">聚落、生产、交通</text><text x="500" y="425" font-size="24" text-anchor="middle" fill="#233c36">区域概括之后，再比较内部两个不同地点</text></g></svg>