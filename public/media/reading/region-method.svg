<svg xmlns="http://www.w3.org/2000/svg" width="540" height="314" viewBox="0 0 540 314" role="img" aria-labelledby="title desc">
<title id="title">怎样把两个地区放在一起比较</title><desc id="desc">先明确所比较的地区范围，再看水、地形等条件怎样影响土地使用，沿河流或交通线追踪两个地区如何联系。两地都用同一组问题，差异才有明确含义。</desc>
<defs><marker id="warm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aa583b"/></marker><marker id="cool" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#236b81"/></marker></defs>
<rect x="0" y="0" width="540" height="314" rx="10" fill="#f7f5ec"/><g font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><text x="20" y="39" font-size="29" fill="#233e39" text-anchor="start">怎样把两个地区放在一起比较</text><rect x="17" y="63" width="506" height="58" rx="6" fill="#e2eadc"/><text x="34" y="99" font-size="24" fill="#233e39" text-anchor="start">比范围</text><text x="176" y="99" font-size="21" fill="#233e39" text-anchor="start">各自包含哪些地方？</text>
<rect x="17" y="132" width="506" height="58" rx="6" fill="#ede6d7"/><text x="34" y="168" font-size="24" fill="#233e39" text-anchor="start">比条件</text><text x="176" y="168" font-size="21" fill="#233e39" text-anchor="start">水从哪里来，地势怎样？</text>
<rect x="17" y="201" width="506" height="58" rx="6" fill="#e2eadc"/><text x="34" y="237" font-size="24" fill="#233e39" text-anchor="start">比联系</text><text x="176" y="237" font-size="21" fill="#233e39" text-anchor="start">人和货物沿哪些路往来？</text><text x="520" y="302" font-size="16" fill="#53675f" text-anchor="end">概念示意 · 非实测</text></g></svg>
