<svg xmlns="http://www.w3.org/2000/svg" width="540" height="340" viewBox="0 0 540 340" role="img" aria-labelledby="title desc">
<title id="title">板块边界的三种运动</title><desc id="desc">俯视同一条边界两侧的地块。汇聚时，两侧相互靠近。张裂时，两侧相互远离。沿转换边界，两侧平行于边界反向滑动。</desc>
<defs><marker id="warm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aa583b"/></marker><marker id="cool" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#236b81"/></marker></defs>
<rect x="0" y="0" width="540" height="340" rx="10" fill="#f7f5ec"/><g font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><text x="20" y="39" font-size="29" fill="#233e39" text-anchor="start">板块边界的三种运动</text><g transform="translate(14 59)"><rect x="10" y="5" width="208" height="60" rx="7" fill="#d4dfcb"/><path d="M114 6l8 16-9 17 5 25" fill="none" stroke="#625f55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 35h48" fill="none" stroke="#236b81" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cool)"/><path d="M177 35h-48" fill="none" stroke="#236b81" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cool)"/><text x="248" y="30" font-size="26" fill="#233e39" text-anchor="start">汇聚</text><text x="248" y="58" font-size="21" fill="#233e39" text-anchor="start">两侧相向靠近</text></g>
<g transform="translate(14 148)"><rect x="10" y="5" width="208" height="60" rx="7" fill="#d4dfcb"/><path d="M114 6l8 16-9 17 5 25" fill="none" stroke="#625f55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 35H53" fill="none" stroke="#236b81" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cool)"/><path d="M129 35h47" fill="none" stroke="#236b81" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cool)"/><text x="248" y="30" font-size="26" fill="#233e39" text-anchor="start">张裂</text><text x="248" y="58" font-size="21" fill="#233e39" text-anchor="start">两侧相互远离</text></g>
<g transform="translate(14 237)"><rect x="10" y="5" width="208" height="60" rx="7" fill="#d4dfcb"/><path d="M115 5v63" fill="none" stroke="#625f55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 53V14" fill="none" stroke="#236b81" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cool)"/><path d="M144 17V54" fill="none" stroke="#236b81" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cool)"/><text x="248" y="30" font-size="26" fill="#233e39" text-anchor="start">转换</text><text x="248" y="58" font-size="21" fill="#233e39" text-anchor="start">沿边界水平错动</text></g><text x="520" y="328" font-size="16" fill="#53675f" text-anchor="end">概念示意 · 非实测</text></g></svg>
