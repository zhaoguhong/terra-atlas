<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">板块边界的三种基本相对运动</title><desc id="desc">汇聚、张裂和转换概括相对运动方向。真实边界结构更复杂，图中不表示具体板块的位置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">板块边界的三种基本相对运动</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="55" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="75" y="248" font-size="24" text-anchor="start" fill="#233c36">汇聚</text><text x="75" y="286" font-size="19" text-anchor="start" fill="#233c36">彼此靠近</text><rect x="360" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="380" y="248" font-size="24" text-anchor="start" fill="#233c36">张裂</text><text x="380" y="286" font-size="19" text-anchor="start" fill="#233c36">彼此远离</text><rect x="665" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="685" y="248" font-size="24" text-anchor="start" fill="#233c36">转换</text><text x="685" y="286" font-size="19" text-anchor="start" fill="#233c36">沿边界相对错动</text><path d="M95 390 L180 390" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M290 390 L205 390" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M485 390 L405 390" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M530 390 L610 390" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M755 430 L755 350" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M825 350 L825 430" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/></g></svg>