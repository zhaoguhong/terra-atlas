<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">盆地：内部比周围低</title><desc id="desc">高海拔地区同样可以有盆地。围绕低地观察山地、河流入口和出口，比只看一个高度更有用。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">盆地：内部比周围低</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M55 400 L160 195 L270 345 L390 390 L570 390 L720 340 L850 185 L945 390 L945 465 L55 465 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="150" font-size="25" text-anchor="start" fill="#233c36">周围高地</text><text x="150" y="185" font-size="19" text-anchor="start" fill="#233c36">山地汇集来水</text><text x="405" y="300" font-size="25" text-anchor="start" fill="#233c36">盆地内部</text><text x="405" y="335" font-size="19" text-anchor="start" fill="#233c36">相对周围较低</text><path d="M250 300 L370 360" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M755 285 L650 355" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="675" y="455" font-size="20" text-anchor="start" fill="#233c36">整体海拔可高可低</text></g></svg>