<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">城市与流域之间的水联系</title><desc id="desc">雨水、供水、排水及处理设施构成相连路径。图示为概念关系，具体城市的系统需要单独核对。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">城市与流域之间的水联系</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><g fill="#dce9e9"><circle cx="440" cy="145" r="20" fill="#dce9e9"/><circle cx="467" cy="137" r="29" fill="#dce9e9"/><circle cx="494" cy="145" r="22" fill="#dce9e9"/><rect x="424" y="145" width="87" height="21" rx="8" fill="#dce9e9"/></g><path d="M440 180 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M465 180 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M490 180 l-9 28" fill="none" stroke="#5c9fb1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="380" width="840" height="55" rx="12" fill="#cce3e9"/><rect x="200" y="330" width="55" height="100" rx="0" fill="#c5a471"/><rect x="280" y="290" width="55" height="140" rx="0" fill="#c5a471"/><rect x="360" y="250" width="55" height="180" rx="0" fill="#c5a471"/><rect x="580" y="330" width="55" height="100" rx="0" fill="#c5a471"/><rect x="660" y="290" width="55" height="140" rx="0" fill="#c5a471"/><rect x="740" y="250" width="55" height="180" rx="0" fill="#c5a471"/><path d="M100 335 L180 335" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M430 345 L535 395" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="70" y="290" font-size="21" text-anchor="start" fill="#233c36">水源与输水</text><text x="565" y="465" font-size="22" text-anchor="start" fill="#233c36">排水 → 处理 → 河流</text><text x="500" y="510" font-size="21" text-anchor="middle" fill="#233c36">地表覆盖、下渗与蓄排空间影响雨水去向</text></g></svg>