<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">地势阶梯：区域概括与局部起伏</title><desc id="desc">三级阶梯概括中国西高东低的大势。此图没有指定剖面路线，也不代表每处地面的真实形状。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">地势阶梯：区域概括与局部起伏</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M45 240 L90 210 L145 230 L190 205 L260 220 L300 295 L360 280 L420 310 L480 288 L535 305 L580 380 L680 375 L740 390 L815 365 L860 390 L950 390 L950 460 L45 460 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="90" y="165" font-size="26" text-anchor="start" fill="#233c36">第一级</text><text x="350" y="230" font-size="26" text-anchor="start" fill="#233c36">第二级</text><text x="700" y="320" font-size="26" text-anchor="start" fill="#233c36">第三级</text><path d="M65 490 L930 490" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="50" y="525" font-size="20" text-anchor="start" fill="#233c36">西</text><text x="925" y="525" font-size="20" text-anchor="start" fill="#233c36">东</text></g></svg>