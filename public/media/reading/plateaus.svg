<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">高原与平原：先看区域高差</title><desc id="desc">剖面中的高原面仍有谷地，平原也有小幅起伏。图示强调相对关系，不表示实测海拔。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">高原与平原：先看区域高差</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M55 395 L120 350 L160 215 L330 215 L365 280 L390 215 L520 225 L570 330 L650 395 L760 383 L850 392 L945 390 L945 465 L55 465 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="195" y="155" font-size="25" text-anchor="start" fill="#233c36">高原</text><text x="195" y="190" font-size="19" text-anchor="start" fill="#233c36">较高的广阔地形，可被河谷切割</text><text x="710" y="300" font-size="25" text-anchor="start" fill="#233c36">平原</text><text x="710" y="335" font-size="19" text-anchor="start" fill="#233c36">较低、起伏较小</text><path d="M378 300 L378 265" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="320" y="340" font-size="20" text-anchor="start" fill="#233c36">河谷</text></g></svg>