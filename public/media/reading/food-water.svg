<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">从水土条件到粮食与城市</title><desc id="desc">农业生产、运输储存和城市消费相互连接。粮食产地与人口集中地并不一定重合。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">从水土条件到粮食与城市</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="55" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="75" y="248" font-size="24" text-anchor="start" fill="#233c36">土地与水热</text><text x="75" y="286" font-size="19" text-anchor="start" fill="#233c36">土壤、雨季、灌排</text><path d="M335 260 L350 260" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><rect x="360" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="380" y="248" font-size="24" text-anchor="start" fill="#233c36">农业生产</text><text x="380" y="286" font-size="19" text-anchor="start" fill="#233c36">作物、技术、管理</text><path d="M640 260 L655 260" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><rect x="665" y="210" width="275" height="102" rx="12" fill="#dbe7d4"/><text x="685" y="248" font-size="24" text-anchor="start" fill="#233c36">城市与市场</text><text x="685" y="286" font-size="19" text-anchor="start" fill="#233c36">运输、储存、消费</text><path d="M810 340 Q500 460 185 340" fill="none" stroke="#729875" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text 