<svg xmlns="http://www.w3.org/2000/svg" width="540" height="314" viewBox="0 0 540 314" role="img" aria-labelledby="title desc">
<title id="title">粮食离开农田以后</title><desc id="desc">作物长成后，收获、储存、加工和运输仍会影响城市能够得到的粮食。沿着来路看，城里吃的粮食也联系着产地的土地和水源。</desc>
<defs><marker id="warm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aa583b"/></marker><marker id="cool" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#236b81"/></marker></defs>
<rect x="0" y="0" width="540" height="314" rx="10" fill="#f7f5ec"/><g font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><text x="20" y="39" font-size="29" fill="#233e39" text-anchor="start">粮食离开农田以后</text><rect x="17" y="63" width="506" height="58" rx="6" fill="#e2eadc"/><text x="34" y="99" font-size="24" fill="#233e39" text-anchor="start">在田里</text><text x="176" y="99" font-size="21" fill="#233e39" text-anchor="start">土壤、水和热量影响生长</text>
<rect x="17" y="132" width="506" height="58" rx="6" fill="#ede6d7"/><text x="34" y="168" font-size="24" fill="#233e39" text-anchor="start">收获后</text><text x="176" y="168" font-size="21" fill="#233e39" text-anchor="start">干燥和储存减少损耗</text>
<rect x="17" y="201" width="506" height="58" rx="6" fill="#e2eadc"/><text x="34" y="237" font-size="24" fill="#233e39" text-anchor="start">到市场</text><text x="176" y="237" font-size="21" fill="#233e39" text-anchor="start">运输把粮食送到消费地</text><text x="520" y="302" font-size="16" fill="#53675f" text-anchor="end">概念示意 · 非实测</text></g></svg>
