<title id="title">地面以下的土层</title><desc id="desc">表层可见根系与有机物。水向下渗时，也能把一些溶解物和细颗粒带入下层。更深处的母质为土壤发育提供矿物材料。不同地点土层的厚度、颜色和分层会变化。</desc>
