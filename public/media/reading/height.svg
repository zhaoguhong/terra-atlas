<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">纬度之外，还要看高度</title><desc id="desc">同一地区从低地上山，温度、风和水分条件会变化。植被带与雪线受多种因素影响，图中不设统一海拔阈值。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">纬度之外，还要看高度</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M40 410 L180 290 L280 155 L400 290 L510 410 Z" fill="#c5a471" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M280 155 L229 222 L280 205 L318 223 Z" fill="#fff" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M40 410 L180 290 L210 327 L355 327 L510 410 Z" fill="#729875" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M570 420 L570 175" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><text x="625" y="200" font-size="25" text-anchor="start" fill="#233c36">高处</text><text x="625" y="235" font-size="19" text-anchor="start" fill="#233c36">通常气温较低，气压较低</text><text x="625" y="340" font-size="25" text-anchor="start" fill="#233c36">低处</text><text x="625" y="375" font-size="19" text-anchor="start" fill="#233c36">还需比较纬度与水分条件</text><text x="130" y="470" font-size="20" text-anchor="start" fill="#233c36">山地剖面示意</text></g></svg>