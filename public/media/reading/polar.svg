<svg xmlns="http://www.w3.org/2000/svg" width="540" height="305" viewBox="0 0 540 305" role="img" aria-labelledby="title desc">
<title id="title">海冰浮在水上，冰盖覆在陆上</title><desc id="desc">左侧的海冰由海水冻结形成，漂在北冰洋上。右侧的南极冰盖来自陆上多年积雪，压实成冰后缓慢向海岸流动。两极都有海冰。</desc>
