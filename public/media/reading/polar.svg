<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">北极与南极：先分清海冰与陆地冰</title><desc id="desc">北极以海洋为中心，南极以大陆为主体。图为剖面概括，冰体厚度与地形不按比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">北极与南极：先分清海冰与陆地冰</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="65" y="325" width="390" height="100" rx="12" fill="#b7d8e1"/><rect x="65" y="315" width="390" height="12" rx="0" fill="#fff"/><path d="M65 425 L65 295 L110 310 L145 425 M375 425 L420 305 L455 295 L455 425" fill="#c5a471" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="260" y="200" font-size="25" text-anchor="middle" fill="#233c36">北极：海洋与海冰</text><text x="260" y="475" font-size="21" text-anchor="middle" fill="#233c36">海冰漂浮在海水上</text><rect x="550" y="355" width="390" height="70" rx="12" fill="#b7d8e1"/><path d="M590 425 L640 330 L850 330 L900 425 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M640 330 Q745 200 850 330 Z" fill="#fff" stroke="#5c9fb1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="745" y="200" font-size="25" text-anchor="middle" fill="#233c36">南极：大陆与冰盖</text><text x="745" y="475" font-size="21" text-anchor="middle" fill="#233c36">冰盖覆盖陆地</text></g></svg>