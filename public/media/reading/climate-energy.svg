<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">温室效应：地球与大气交换能量</title><desc id="desc">箭头仅表示部分能量传递方向，长度和粗细不代表测量值。温室气体吸收并向各方向发射红外辐射。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">温室效应：地球与大气交换能量</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="55" y="425" width="890" height="40" rx="0" fill="#729875"/><rect x="55" y="195" width="890" height="75" rx="12" fill="#e5e9dd"/><circle cx="130" cy="135" r="35" fill="#c5a471"/><path d="M175 155 L350 410" fill="none" stroke="#5c9fb1" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 410 L490 135" fill="none" stroke="#b7735c" stroke-width="4" marker-end="url(#warm)"/><path d="M650 410 L650 285" fill="none" stroke="#b7735c" stroke-width="4" marker-end="url(#warm)"/><path d="M690 285 L790 400" fill="none" stroke="#b7735c" stroke-width="4" marker-end="url(#warm)"/><text x="215" y="325" font-size="22" text-anchor="start" fill="#233c36">太阳辐射</text><text x="345" y="170" font-size="22" text-anchor="start" fill="#233c36">向太空辐射</text><text x="95" y="240" font-size="22" text-anchor="start" fill="#233c36">大气中的温室气体</text><text x="715" y="320" font-size="21" text-anchor="start" fill="#233c36">向地表辐射</text><text x="500" y="510" font-size="23" text-anchor="middle" fill="#233c36">比较长期能量收支，需要观测与物理模型</text></g></svg>