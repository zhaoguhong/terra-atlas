<svg xmlns="http://www.w3.org/2000/svg" width="540" height="324" viewBox="0 0 540 324" role="img" aria-labelledby="title desc">
<title id="title">地面放出的热量去了哪里</title><desc id="desc">太阳辐射使地面增温。地面向上发出红外辐射，一部分穿过大气到达太空，另一部分被温室气体吸收。大气也向各方向发出红外辐射，包括向下回到地面。</desc>
