<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">冰川谷与河谷：比较横剖面</title><desc id="desc">理想 U 形与 V 形用于认识典型差别。地貌成因还需要擦痕、沉积物和区域历史等证据。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">冰川谷与河谷：比较横剖面</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><path d="M60 220 L140 300 L255 430 L370 300 L450 220 L450 465 L60 465 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M550 220 L615 320 Q620 430 750 430 Q880 430 885 320 L950 220 L950 465 L550 465 Z" fill="#c5a471" stroke="#233c36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="255" y="160" font-size="26" text-anchor="middle" fill="#233c36">典型河谷</text><text x="750" y="160" font-size="26" text-anchor="middle" fill="#233c36">典型冰川谷</text><text x="255" y="510" font-size="23" text-anchor="middle" fill="#233c36">V 形横剖面</text><text x="750" y="510" font-size="23" text-anchor="middle" fill="#233c36">U 形横剖面</text></g></svg>