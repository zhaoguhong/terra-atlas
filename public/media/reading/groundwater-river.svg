<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 335" width="540" height="335" role="img" aria-labelledby="title desc">
  <title id="title">地下水怎样补给河流</title>
  <desc id="desc">河谷横剖面中，两岸的地下水面向中间降低，与河面相接。地下水面下方仍有砂砾，两支箭头从这些饱水砂砾指向较低的河床。</desc>
