<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">总体比例不能代替个人信息</title><desc id="desc">示意条带包含多个群体。用一种主色概括地区，会隐藏内部构成；本图没有使用实际宗教比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5c9fb1" stroke-width="1.3"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b7735c" stroke-width="1.3"/></marker></defs><rect width="1000" height="560" rx="18" fill="#f6f3e9"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="45" y="60" font-size="30" text-anchor="start" fill="#233c36">总体比例不能代替个人信息</text><text x="955" y="92" font-size="16" text-anchor="end" fill="#68766c">概念示意 · 非实测</text><rect x="80" y="235" width="230" height="90" rx="0" fill="#729875"/><rect x="310" y="235" width="175" height="90" rx="0" fill="#c5a471"/><rect x="485" y="235" width="120" height="90" rx="0" fill="#5c9fb1"/><rect x="605" y="235" width="155" height="90" rx="0" fill="#b7735c"/><rect x="760" y="235" width="160" height="90" rx="0" fill="#c5c5b3"/><text x="500" y="180" font-size="28" text-anchor="middle" fill="#233c36">一个地区 · 多种群体</text><circle cx="135" cy="390" r="13" fill="#729875"/><circle cx="186" cy="390" r="13" fill="#c5a471"/><circle cx="237" cy="390" r="13" fill="#5c9fb1"/><circle cx="288" cy="390" r="13" fill="#b7735c"/><circle cx="339" cy="390" r="13" fill="#c5c5b3"/><circle cx="390" cy="390" r="13" fill="#729875"/><circle cx="441" cy="390" r="13" fill="#c5a471"/><circle cx="492" cy="390" r="13" fill="#5c9fb1"/><circle cx="543" cy="390" r="13" fill="#b7735c"/><circle cx="594" cy="390" r="13" fill="#c5c5b3"/><circle cx="645" cy="390" r="13" fill="#729875"/><circle cx="696" cy="390" r="13" fill="#c5a471"/><circle cx="747" cy="390" r="13" fill="#5c9fb1"/><circle cx="798" cy="390" r="13" fill="#b7735c"/><circle cx="849" cy="390" r="13" fill="#c5c5b3"/><text x="500" y="475" font-size="23" text-anchor="middle" fill="#233c36">统计构成与个人认同是不同层次的信息</text></g></svg>