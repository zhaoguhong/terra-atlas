<svg xmlns="http://www.w3.org/2000/svg" width="540" height="273" viewBox="0 0 540 273" role="img" aria-labelledby="title desc">
<title id="title">同一地区可以包含多种归属</title><desc id="desc">每个方块代表同样的人数，三个颜色表示三组示例。若只按人数最多的一组给整个地区着色，其余两组仍生活在这里。图中没有采用真实地区的宗教统计。</desc>
