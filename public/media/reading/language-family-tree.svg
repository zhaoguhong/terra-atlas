<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="language-family-tree-title language-family-tree-desc"><title id="language-family-tree-title">语言的亲缘：印欧语系的一部分</title><desc id="language-family-tree-desc">英语与德语是较近的亲属，西班牙语、葡萄牙语与法语属于另一支；印地语与波斯语也在这个大家族中。只列部分成员，不表示分化年代。</desc><rect width="1000" height="580" rx="14" fill="#f7f4eb"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="42" y="56" fill="#294840" font-size="30" text-anchor="start">语言的亲缘：印欧语系的一部分</text><text x="42" y="92" fill="#66766e" font-size="19" text-anchor="start">从共同祖语逐渐分化，形成远近不同的语言支系</text><rect x="42" y="273" width="185" height="78" rx="8" fill="#dde5d6"/><text x="134" y="322" fill="#294840" font-size="28" text-anchor="middle">印欧语系</text><path d="M227,312L275,312" fill="none" stroke="#a0ada0" stroke-width="2"/><path d="M275,170L275,470" fill="none" stroke="#a0ada0" stroke-width="2"/><path d="M275,170L316,170" fill="none" stroke="#a0ada0" stroke-width="2"/><rect x="316" y="138" width="250" height="64" rx="7" fill="#e7eadd"/><text x="441" y="178" fill="#294840" font-size="24" text-anchor="middle">日耳曼语族</text><path d="M566,170L605,170" fill="none" stroke="#a0ada0" stroke-width="2"/><text x="625" y="178" fill="#294840" font-size="22" text-anchor="start">英语 · 德语</text><path d="M275,270L316,270" fill="none" stroke="#a0ada0" stroke-width="2"/><rect x="316" y="238" width="250" height="64" rx="7" fill="#e7eadd"/><text x="441" y="278" fill="#294840" font-size="24" text-anchor="middle">罗曼语族</text><path d="M566,270L605,270" fill="none" stroke="#a0ada0" stroke-width="2"/><text x="625" y="278" fill="#294840" font-size="22" text-anchor="start">西班牙语 · 葡萄牙语 · 法语</text><path d="M275,370L316,370" fill="none" stroke="#a0ada0" stroke-width="2"/><rect x="316" y="338" width="250" height="64" rx="7" fill="#e7eadd"/><text x="441" y="378" fill="#294840" font-size="24" text-anchor="middle">斯拉夫语族</text><path d="M566,370L605,370" fill="none" stroke="#a0ada0" stroke-width="2"/><text x="625" y="378" fill="#294840" font-size="22" text-anchor="start">俄语 · 波兰语</text><path d="M275,470L316,470" fill="none" stroke="#a0ada0" stroke-width="2"/><rect x="316" y="438" width="250" height="64" rx="7" fill="#e7eadd"/><text x="441" y="478" fill="#294840" font-size="24" text-anchor="middle">印度—伊朗语族</text><path d="M566,470L605,470" fill="none" stroke="#a0ada0" stroke-width="2"/><text x="625" y="478" fill="#294840" font-size="22" text-anchor="start">印地语 · 孟加拉语 · 波斯语</text><text x="42" y="552" fill="#66766e" font-size="18" text-anchor="start">概念示意 · 只列部分分支与语言，省略中间层级；线长不表示年代。</text></g></svg>